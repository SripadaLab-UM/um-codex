[project]
name = "umcodex"
dynamic = ["version"]
description = "UM-Codex: Codex on U-M GPT Toolkit, in a Docker sandbox"
requires-python = ">=3.13"
dependencies = [
  # Pinned: the relay holds the Toolkit key, so its dependencies change only on purpose.
  "aiohttp==3.14.3",
  "httpx==0.28.1",
  "keyring==25.7.0",
  "tomli-w==1.2.0",
]

[project.scripts]
um-codex = "umcodex.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.9", "pyright==1.1.414"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/umcodex/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/umcodex"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
