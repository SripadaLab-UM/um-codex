[project]
name = "umcodex"
dynamic = ["version"]
description = "UM-Codex: Codex on U-M GPT Toolkit, in a Docker sandbox"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28",
  "keyring>=25",
  "tomli-w>=1.2",
]

[project.scripts]
um-codex = "umcodex.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "pyright>=1.1.390"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/umcodex/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/umcodex"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
