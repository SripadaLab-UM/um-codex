# Adapted from IHS DataLab's .github/workflows/release.yml at 6b6fdca.
name: Release

# Push a tag like v0.1.0-alpha.2 (for version 0.1.0a2) to publish a release
# (docs/RELEASING.md):
# 0. run all of CI on the tagged commit (ci.yml); check the tag matches the
#    package version and that the package pins a release key; stop if not;
# 1. build the agent image for Intel/AMD and Apple silicon and push it to the
#    GitHub Container Registry, unless images/agent is unchanged since an
#    image already there (job `reuse`, keyed by its git tree id): then that
#    image is used as it is, and installed copies have nothing new to pull;
# 2. build the package with the agent image (and the gateway's nginx, pinned
#    in src/umcodex/images.json) pinned by digest inside it, and gather the
#    release's files: the package, every dependency pinned by hash
#    (requirements.txt), the installers with this release written into them,
#    the exact images (images.json) and SHA256SUMS (job `package`, which
#    never sees the signing key; scripts/build-release.sh);
# 3. sign SHA256SUMS with Ed25519 (SHA256SUMS.sig), using the
#    RELEASE_SIGNING_KEY secret of the protected "release" environment, on a
#    fresh runner that runs no build and no Docker (job `sign`, the only job
#    in that environment; tests/test_release.py checks it stays so). It
#    refuses a key the package doesn't pin;
# 4. create the GitHub Release with all of them (job `publish`).
#    `um-codex update` refuses a release without a valid signature.
#
# If signing fails (or is never approved), nothing is published, but the
# agent image from step 1 stays pushed to the registry. That's harmless:
# UM-Codex only runs images by the digests in a signed images.json.
#
# Not done here, because each needs something CI doesn't have:
# - TODO(signing): Authenticode-sign install-windows.ps1 and
#   uninstall-windows.ps1 (the lab's code-signing certificate).
# - TODO(windows): the install, update and rollback on a real Windows machine.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/sripadalab-um/um-codex-agent

jobs:
  checks:
    # Everything CI checks, on exactly the tagged commit. Nothing is
    # published unless it all passes.
    uses: ./.github/workflows/ci.yml

  version:
    # Before anything is pushed: a tag that doesn't match the package version
    # would publish under the wrong name, and a package that pins no release
    # key could never check its next update.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches the package version
        # Pre-releases included: v0.1.0-alpha.2 is version 0.1.0a2 (PEP 440).
        run: sh scripts/release-version.sh "$GITHUB_REF_NAME"
      - name: Check the package pins a release key
        run: |
          uv sync --locked --no-dev --no-install-project
          PYTHONPATH=src uv run --no-sync python scripts/sign-release.py --check-pinned

  reuse:
    # The agent image depends only on images/agent, so it's keyed by that
    # folder's git tree id. If an image for this tree is in the registry
    # already, the release uses it as it is.
    needs: [checks, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      tree: ${{ steps.find.outputs.tree }}
      image: ${{ steps.find.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Look for an image built from this images/agent
        id: find
        run: |
          tree=$(git rev-parse HEAD:images/agent)
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          if digest=$(docker buildx imagetools inspect "$IMAGE:tree-$tree" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"') && [ -n "$digest" ]; then
            echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
            echo "Reusing $IMAGE@$digest (images/agent unchanged, tree $tree)."
          else
            echo "No image for tree $tree yet: building one."
          fi

  image:
    needs: [checks, version, reuse]
    if: needs.reuse.outputs.image == ''
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (by digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: images/agent
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Remember the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*

  manifest:
    needs: [reuse, image]
    # Runs after a build, or with none when the image is reused.
    if: ${{ !cancelled() && needs.reuse.result == 'success' && (needs.image.result == 'success' || needs.image.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.pin.outputs.image }}
    steps:
      - uses: actions/download-artifact@v4
        if: needs.reuse.outputs.image == ''
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Combine both platforms under the version and tree tags
        if: needs.reuse.outputs.image == ''
        env:
          TREE: ${{ needs.reuse.outputs.tree }}
        run: |
          test "$(ls /tmp/digests | wc -l)" -eq 2 || { echo "Expected two platforms' digests."; exit 1; }
          docker buildx imagetools create -t "$IMAGE:${GITHUB_REF_NAME}" -t "$IMAGE:tree-$TREE" \
            $(printf "$IMAGE@sha256:%s " $(ls /tmp/digests))
      - name: Tag the reused image with this version
        if: needs.reuse.outputs.image != ''
        env:
          REUSED: ${{ needs.reuse.outputs.image }}
        run: docker buildx imagetools create -t "$IMAGE:${GITHUB_REF_NAME}" "$REUSED"
      - name: Pin the combined image by digest
        id: pin
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:${GITHUB_REF_NAME}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"

  package:
    # Builds the package and gathers the release's files. It runs the build
    # (and its tools), so it never sees the signing key: `sign` signs, on a
    # fresh runner.
    needs: manifest
    if: ${{ !cancelled() && needs.manifest.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Build the release's files
        env:
          AGENT_IMAGE: ${{ needs.manifest.outputs.image }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: sh scripts/build-release.sh assets
      - name: Release notes
        env:
          AGENT_IMAGE: ${{ needs.manifest.outputs.image }}
        run: |
          gateway=$(python3 -c 'import json; print(json.load(open("assets/images.json"))["gateway"])')
          base="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          {
            echo "Install (or update to this version with the installer):"
            echo ""
            echo "- Mac, in Terminal: \`curl -q -fsSL $base/install-macos.sh | sh\`"
            echo "- Windows, in Windows PowerShell: \`[Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor 3072; irm $base/install-windows.ps1 | iex\`"
            echo ""
            echo "Already installed: \`um-codex update\`."
            echo ""
            echo "Images, pinned by digest:"
            echo ""
            echo "- Agent: \`$AGENT_IMAGE\`"
            echo "- Gateway: \`$gateway\`"
            echo ""
            echo "SHA256SUMS is signed with UM-Codex's release key (SHA256SUMS.sig); \`um-codex update\` checks it."
            echo "To check a download against SHA256SUMS: \`shasum -a 256 -c SHA256SUMS --ignore-missing\`"
            echo "on Mac, or compare \`Get-FileHash <file>\` with it on Windows."
          } > notes.md
          mkdir -p notes && mv notes.md notes/
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: assets/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes/notes.md
          if-no-files-found: error

  sign:
    # The only job that can use the signing key: behind the "release"
    # environment's required reviewers, on a fresh runner that never runs the
    # build or Docker. It gets the release's files, the tag's own code (for
    # sign-release.py and the pinned keys) and its locked Python
    # dependencies, and hands back only SHA256SUMS.sig.
    needs: package
    # Explicit, since an upstream image build may be skipped (image reused).
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install the signing script's dependencies (locked)
        # Only the locked dependencies, by hash: the package itself isn't
        # built here (no build backend runs), it's read from the tag's source.
        run: uv sync --locked --no-dev --no-install-project
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets
      - name: Sign SHA256SUMS
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          # What's signed is what's listed: every file must match first, and
          # nothing may be there that isn't listed.
          (cd assets && sha256sum --strict -c SHA256SUMS)
          test "$(ls assets | wc -l)" -eq "$(($(wc -l < assets/SHA256SUMS) + 1))"
          # Refuses without the key, or when the tag's code doesn't pin its public key.
          PYTHONPATH=src uv run --no-sync python scripts/sign-release.py assets/SHA256SUMS
          mkdir -p signature && mv assets/SHA256SUMS.sig signature/
      - uses: actions/upload-artifact@v4
        with:
          name: release-signature
          path: signature/SHA256SUMS.sig
          if-no-files-found: error

  publish:
    needs: [package, sign]
    if: ${{ !cancelled() && needs.package.result == 'success' && needs.sign.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: release-signature
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub's releases/latest never points at a pre-release, and the
          # install commands use releases/latest/download. So a pre-release
          # version (a, b, rc) is marked a pre-release only once a full
          # release exists; until then it's the latest release.
          which="--latest"
          case "$GITHUB_REF_NAME" in
            *-*)
              full=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
                --limit 1 --json tagName --jq 'length')
              if [ "$full" != "0" ]; then which="--prerelease"; fi ;;
          esac
          gh release create "$GITHUB_REF_NAME" $which \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "UM-Codex $GITHUB_REF_NAME" \
            --notes-file notes/notes.md \
            assets/*
