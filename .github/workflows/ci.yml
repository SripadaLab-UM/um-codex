# Adapted from IHS DataLab's .github/workflows/ci.yml at 6b6fdca (the
# backend and windows-installer jobs).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow (M3) runs all of this on the tagged commit before it
  # publishes anything.
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run pyright
      - name: Unit tests
        run: uv run pytest -q --ignore=tests/test_macos_installer.py

  mac-installer:
    # The macOS installer's tests run the scripts with stand-ins for docker,
    # uv, curl, hdiutil and sudo, on macOS's own /bin/sh, and type answers
    # through a real terminal.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: The scripts are valid sh and shellcheck-clean
        run: |
          sh -n installer/macos/install.sh && sh -n installer/macos/uninstall.sh
          uvx --from shellcheck-py shellcheck -s sh installer/macos/install.sh installer/macos/uninstall.sh
      - name: Installer tests
        run: uv run pytest -q tests/test_macos_installer.py

  windows-installer:
    # No Windows machine runs the full install in CI (Docker Desktop), but the
    # installer and uninstaller must at least parse under Windows PowerShell
    # 5.1, run from a file and from `irm | iex` without closing the window,
    # find the package beside them, and their Docker Desktop restart and file
    # removal must do what they say.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: The scripts parse (Windows PowerShell 5.1, as people run them)
        shell: powershell
        run: |
          foreach ($file in "install.ps1", "uninstall.ps1") {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("installer/windows/$file", [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Host "${file}: $_" }; exit 1 }
          }
          Write-Host "Both parse."
      - name: From a file a stop exits with its code; from iex it ends only the installer
        # A package that isn't there stops the installer before it changes
        # anything (exit 2). Run as a file, that's the process's exit code.
        # Run through iex, or as a script block with arguments, the person's
        # PowerShell must keep running (an `exit` would close their window).
        shell: powershell
        run: |
          $install = Join-Path $Env:GITHUB_WORKSPACE "installer/windows/install.ps1"
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File $install -Package "missing-umcodex-0.0.0-py3-none-any.whl" 2>&1 | Out-String
          if ($LASTEXITCODE -ne 2 -or $out -notmatch "Package file not found") { Write-Host "file run: exit $LASTEXITCODE`n$out"; exit 1 }
          # Typed at a prompt, not from a script file: as the person runs it.
          $probe = @(
            "`$text = Get-Content -Raw '$install'"
            "& ([scriptblock]::Create(`$text)) -Package 'missing-umcodex-0.0.0-py3-none-any.whl'"
            "'BLOCK-EXIT=' + `$LASTEXITCODE"
            "Invoke-Expression `$text"
            "'IEX-EXIT=' + `$LASTEXITCODE"
            "'STILL-RUNNING'"
          ) -join "`n"
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($probe))
          $out = & powershell -NoProfile -EncodedCommand $encoded 2>&1 | Out-String
          foreach ($want in "Package file not found", "BLOCK-EXIT=2", "wasn't found beside the installer", "IEX-EXIT=2", "STILL-RUNNING") {
            if ($out -notmatch [regex]::Escape($want)) { Write-Host "missing '$want' in:`n$out"; exit 1 }
          }
          Write-Host "File run exits 2; script block and iex runs end the installer and the window carries on."
      - name: The uninstaller runs to the end with nothing installed, from a file and from iex
        shell: powershell
        run: |
          $uninstall = Join-Path $Env:GITHUB_WORKSPACE "installer/windows/uninstall.ps1"
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File $uninstall -KeepData 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $out -notmatch "UM-Codex has been removed." -or $out -notmatch "couldn't run") { Write-Host "exit $LASTEXITCODE`n$out"; exit 1 }
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File $uninstall -DeleteData -KeepData 2>&1 | Out-String
          if ($LASTEXITCODE -ne 2 -or $out -notmatch "Choose one") { Write-Host "both: exit $LASTEXITCODE`n$out"; exit 1 }
          $probe = "Invoke-Expression (Get-Content -Raw '$uninstall')`n'STILL-RUNNING'"
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($probe))
          $out = & powershell -NoProfile -EncodedCommand $encoded 2>&1 | Out-String
          if ($out -notmatch "UM-Codex has been removed." -or $out -notmatch "STILL-RUNNING") { Write-Host $out; exit 1 }
          Write-Host "Both runs reach the end."
      - name: Without -Package, the one package beside the installer is used (and only one), else the release's
        shell: powershell
        run: |
          $script = Get-Content (Join-Path $Env:GITHUB_WORKSPACE "installer/windows/install.ps1") -Raw
          $start = $script.IndexOf('if (-not $Package) {')
          $end = $script.IndexOf('if (-not $Requirements) { Write-Host')
          $slice = $script.Substring($start, $end - $start)
          # Each case runs in a PowerShell of its own, as the lines stop on a problem.
          function Run-Case($name, [string[]]$wheels, $release = "") {
            $dir = New-Item -ItemType Directory -Force -Path (Join-Path $Env:RUNNER_TEMP "beside-$name")
            foreach ($wheel in $wheels) { Set-Content (Join-Path $dir $wheel) "x" }
            Set-Content (Join-Path $dir "requirements.txt") "x"
            $case = Join-Path $Env:RUNNER_TEMP "case-$name.ps1"
            $prefix = "function Stop-Run(`$code) { exit `$code }; function Note(`$t) { Write-Host `$t }; " +
              "`$ScriptFolder = '$($dir.FullName)'; `$Package = ''; `$Requirements = ''; " +
              "`$ReleaseBase = '$release'; `$ReleaseWheel = '$(if ($release) { 'umcodex-9.9.9-py3-none-any.whl' })'`n"
            Set-Content $case ($prefix + $slice + "`n'PACKAGE=' + `$Package`n'REQUIREMENTS=' + `$Requirements")
            $out = & powershell -NoProfile -ExecutionPolicy Bypass -File $case 2>&1 | Out-String
            return @{ Code = $LASTEXITCODE; Out = $out; Dir = $dir.FullName }
          }
          $one = Run-Case "one" @("umcodex-0.0.0-py3-none-any.whl")
          if ($one.Code -ne 0 -or $one.Out -notmatch [regex]::Escape("PACKAGE=" + (Join-Path $one.Dir "umcodex-0.0.0-py3-none-any.whl"))) { Write-Host $one.Out; exit 1 }
          $none = Run-Case "none" @()
          if ($none.Code -ne 2 -or $none.Out -notmatch "wasn't found beside the installer") { Write-Host $none.Out; exit 1 }
          $two = Run-Case "two" @("umcodex-0.0.0-py3-none-any.whl", "umcodex-0.0.1-py3-none-any.whl")
          if ($two.Code -ne 2 -or $two.Out -notmatch "more than one UM-Codex package") { Write-Host $two.Out; exit 1 }
          $base = "https://github.com/SripadaLab-UM/um-codex/releases/download/v9.9.9"
          $release = Run-Case "release" @() $base
          if ($release.Code -ne 0 -or $release.Out -notmatch [regex]::Escape("PACKAGE=$base/umcodex-9.9.9-py3-none-any.whl") -or
              $release.Out -notmatch [regex]::Escape("REQUIREMENTS=$base/requirements.txt")) { Write-Host $release.Out; exit 1 }
          Write-Host "One package: used. None, or two: refused, saying why. None with a release: the release's."
          exit 0  # (not the last case's exit code)
      - name: Only package names with a version are accepted
        shell: powershell
        run: |
          $script = Get-Content (Join-Path $Env:GITHUB_WORKSPACE "installer/windows/install.ps1") -Raw
          $start = $script.IndexOf('$IsUrl =')
          $marker = '$Version = $Matches[1]'
          $slice = $script.Substring($start, $script.IndexOf($marker) + $marker.Length - $start)
          $cases = @{ "umcodex-0.1.0a1-py3-none-any.whl" = 0; "umcodex-7-py3-none-any.whl" = 0
            "umcodex-1.-py3-none-any.whl" = 2; "umcodex-latest-py3-none-any.whl" = 2; "umcodex-.1-py3-none-any.whl" = 2 }
          foreach ($name in $cases.Keys) {
            $dir = New-Item -ItemType Directory -Force -Path (Join-Path $Env:RUNNER_TEMP ("name-" + [guid]::NewGuid()))
            Set-Content (Join-Path $dir $name) "x"; Set-Content (Join-Path $dir "requirements.txt") "x"
            $case = Join-Path $dir "case.ps1"
            Set-Content $case ("function Stop-Run(`$code) { exit `$code }; Set-Location '$($dir.FullName)'; `$Package = '$name'; `$Requirements = ''`n" + $slice + "`n'VERSION=' + `$Version")
            $out = & powershell -NoProfile -ExecutionPolicy Bypass -File $case 2>&1 | Out-String
            if ($LASTEXITCODE -ne $cases[$name]) { Write-Host "$name -> exit $LASTEXITCODE`n$out"; exit 1 }
            Write-Host "$name -> exit $LASTEXITCODE"
          }
          exit 0  # (not the last case's exit code)
      - name: A bare package file name finds requirements.txt beside it
        shell: powershell
        run: |
          $dir = New-Item -ItemType Directory -Path (Join-Path $Env:RUNNER_TEMP "pkg")
          Set-Content (Join-Path $dir "umcodex-0.0.0-py3-none-any.whl") "x"
          Set-Content (Join-Path $dir "requirements.txt") "x"
          Set-Location $dir
          # Run the installer's package-resolution lines on their own.
          $script = Get-Content (Join-Path $Env:GITHUB_WORKSPACE "installer/windows/install.ps1") -Raw
          $start = $script.IndexOf('$IsUrl =')
          $end = $script.IndexOf('if (-not $Requirements) { Write-Host')
          function Stop-Run($code) { exit $code }
          $Package = "umcodex-0.0.0-py3-none-any.whl"; $Requirements = ""
          Invoke-Expression $script.Substring($start, $end - $start)
          if ($Requirements -ne (Join-Path $dir "requirements.txt")) { Write-Host "Found: '$Requirements'"; exit 1 }
          Write-Host "Found $Requirements"
      - name: The pinned uv downloads, matches its SHA-256, and is signed by its publisher
        # The installer's own function, run on its own: this checks the pins
        # (and how Windows names the publisher) before anyone installs.
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $script = Get-Content (Join-Path $Env:GITHUB_WORKSPACE "installer/windows/install.ps1") -Raw
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($script, [ref]$null, [ref]$null)
          foreach ($f in $ast.FindAll({ $args[0] -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true)) {
            if ($f.Name -in "Say", "Good", "Stop-Run", "Stop-Install", "Get-ReparseTag", "Test-Link", "Remove-Entry", "Remove-Tree", "Get-Organisation", "Install-PinnedUv") {
              . ([scriptblock]::Create($f.Extent.Text))
            }
          }
          foreach ($pin in "UvVersion", "UvZipUrl", "UvZipSha256", "UvPublisher") {
            $line = [regex]::Match($script, "(?m)^\`$$pin = .*$").Value
            Invoke-Expression $line
          }
          $State = @{}
          $StateDir = Join-Path $Env:RUNNER_TEMP "UM-Codex"
          $UvDir = Join-Path $StateDir "uv"; $Uv = Join-Path $UvDir "uv.exe"
          New-Item -ItemType Directory -Force $StateDir | Out-Null
          Install-PinnedUv
          $said = & $Uv --version
          if ($said -notmatch "^uv $([regex]::Escape($UvVersion))( |$)") { Write-Host "uv says: $said"; exit 1 }
          Install-PinnedUv  # a second run reuses it
          Write-Host "Pinned $said is fine."
      - name: A copy of a version's launcher runs that version from bin, and current is replaced whole
        # bin\um-codex.exe is a copy of the version's own uv launcher, which
        # names that version's python.exe by its full path: checked here with
        # pip's launcher, made by the pinned uv (from the step above). A
        # running copy is renamed aside, not overwritten.
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $script = Get-Content (Join-Path $Env:GITHUB_WORKSPACE "installer/windows/install.ps1") -Raw
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($script, [ref]$null, [ref]$null)
          foreach ($f in $ast.FindAll({ $args[0] -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true)) {
            if ($f.Name -in "Install-Launcher", "Write-Atomically") { . ([scriptblock]::Create($f.Extent.Text)) }
          }
          function Fail($what) { Write-Host "FAILED: $what"; exit 1 }
          $uv = Join-Path $Env:RUNNER_TEMP "UM-Codex\uv\uv.exe"
          $venv = Join-Path $Env:RUNNER_TEMP "launcher\versions\1"
          & $uv venv -q --no-config --python 3.13 $venv
          & $uv pip install -q --no-config --link-mode copy --python (Join-Path $venv "Scripts\python.exe") pip
          if ($LASTEXITCODE -ne 0) { Fail "pip install" }
          $bin = New-Item -ItemType Directory -Force (Join-Path $Env:RUNNER_TEMP "launcher\bin")
          $copy = Join-Path $bin "pip.exe"
          Install-Launcher (Join-Path $venv "Scripts\pip.exe") $copy
          $said = & $copy --version
          if ($said -notmatch [regex]::Escape($venv)) { Fail "the copy says: $said" }
          # Again, while the copy is running: it's renamed aside, not overwritten.
          $running = Start-Process $copy -ArgumentList "download", "--no-deps", "-d", $Env:RUNNER_TEMP, "pip==24.0" -PassThru -WindowStyle Hidden
          Install-Launcher (Join-Path $venv "Scripts\pip.exe") $copy
          if (-not (Test-Path $copy)) { Fail "no launcher after the swap" }
          $running.WaitForExit()
          $file = Join-Path $Env:RUNNER_TEMP "launcher\current"
          Write-Atomically $file "1.0"
          Write-Atomically $file "2.0"
          if ("$(Get-Content -LiteralPath $file -TotalCount 1)".Trim() -ne "2.0" -or (Test-Path "$file.tmp")) { Fail "current wasn't replaced whole" }
          Write-Host "The copied launcher runs its version ($said); current replaced whole."
      - name: Removing a folder never follows links, and deletes read-only (git-like) files
        # The shared Remove-Tree as it is: a junction and a symbolic link inside
        # go as links (what they point to stays), a read-only file and folder
        # go (git makes its object files read-only), and the reparse tags read
        # as Windows writes them (a junction is a name surrogate).
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $script = Get-Content (Join-Path $Env:GITHUB_WORKSPACE "installer/windows/install.ps1") -Raw
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($script, [ref]$null, [ref]$null)
          foreach ($f in $ast.FindAll({ $args[0] -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true)) {
            if ($f.Name -in "Get-ReparseTag", "Test-Link", "Remove-Entry", "Remove-Tree", "Test-SamePath") {
              . ([scriptblock]::Create($f.Extent.Text))
            }
          }
          function Fail($what) { Write-Host "FAILED: $what"; exit 1 }
          $outside = New-Item -ItemType Directory -Force (Join-Path $Env:RUNNER_TEMP "outside")
          Set-Content (Join-Path $outside "keep.txt") "keep"
          $tree = New-Item -ItemType Directory -Force (Join-Path $Env:RUNNER_TEMP "tree")
          $objects = New-Item -ItemType Directory -Force (Join-Path $tree ".git\objects\ab")
          $object = Join-Path $objects "cdef"
          Set-Content $object "x"
          (Get-Item $object).Attributes = "ReadOnly"
          (Get-Item $objects).Attributes = "Directory, ReadOnly"
          cmd /c mklink /J "$tree\junction" "$outside" | Out-Null
          New-Item -ItemType SymbolicLink -Path (Join-Path $tree "link.txt") -Target (Join-Path $outside "keep.txt") | Out-Null
          $tag = Get-ReparseTag (Join-Path $tree "junction")
          if (("{0:X8}" -f $tag) -ne "A0000003") { Fail ("junction tag {0:X8}" -f $tag) }
          if ((Get-ReparseTag $object) -ne 0) { Fail "a plain file has a reparse tag" }
          if (-not (Test-Link (Get-Item -Force (Join-Path $tree "junction")))) { Fail "a junction isn't a link" }
          if (-not (Test-Link (Get-Item -Force (Join-Path $tree "link.txt")))) { Fail "a symbolic link isn't a link" }
          if (Test-Link (Get-Item -Force $object)) { Fail "a plain file is a link" }
          Remove-Tree $tree.FullName
          if (Test-Path -LiteralPath $tree.FullName) { Fail "left: $((Get-ChildItem -Recurse -Force $tree.FullName | ForEach-Object FullName) -join ', ')" }
          if ((Get-Content (Join-Path $outside "keep.txt")) -ne "keep") { Fail "followed a link" }
          if (-not (Test-SamePath "%USERPROFILE%\x\" (Join-Path $Env:USERPROFILE "X"))) { Fail "Test-SamePath" }
          if (Test-SamePath "C:\a" "C:\ab") { Fail "Test-SamePath matched another folder" }
          Write-Host "Links stay links, read-only files go, and nothing outside was touched."
      - name: The installer's Docker Desktop restart ends only this account's processes, and says when it can't
        # Get-OwnPids, Stop-DockerDesktopProcesses and Stop-DockerVm as they are,
        # over a table of processes: tasklist, taskkill and wsl.exe answer as
        # they did on a Michigan Medicine laptop (2026-09-29, for DataLab).
        # Nothing here ends a real process. Invoke-Captured itself runs for
        # real, on cmd.exe.
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $script = Get-Content (Join-Path $Env:GITHUB_WORKSPACE "installer/windows/install.ps1") -Raw
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($script, [ref]$null, [ref]$null)
          foreach ($f in $ast.FindAll({ $args[0] -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true)) {
            if ($f.Name -in "Invoke-Captured", "Get-OwnPids", "Stop-DockerDesktopProcesses", "Stop-DockerVm") {
              . ([scriptblock]::Create($f.Extent.Text))
            }
          }
          Invoke-Expression ([regex]::Match($script, "(?m)^\`$DockerDesktopImages = .*$").Value)
          function Fail($what) { Write-Host "FAILED: $what"; exit 1 }

          $cmd = Join-Path $Env:SystemRoot "System32\cmd.exe"
          $ran = Invoke-Captured $cmd "/c echo out& echo err 1>&2& exit 3"
          if ($ran.Code -ne 3 -or $ran.Out -notmatch "out" -or $ran.Out -notmatch "err") { Fail "Invoke-Captured: $($ran | Out-String)" }
          if ($null -ne (Invoke-Captured $cmd "/c ping -n 5 127.0.0.1 >nul" 1)) { Fail "Invoke-Captured didn't give up after its time" }

          # From here on, the programs answer from the table instead.
          $SystemDir = "C:\NotUsed"
          $me = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          $script:Unkillable = @(); $script:Ending = @(); $script:Killed = @(); $script:TasklistCode = 0
          function Start-Sleep { param($Seconds) }  # the wait loop, without the waiting
          function Invoke-Captured($file, [string]$arguments, $seconds = 30) {
            $image = [regex]::Match($arguments, '/FI "IMAGENAME eq ([^"]+)"').Groups[1].Value
            $user = [regex]::Match($arguments, '/FI "USERNAME eq ([^"]+)"').Groups[1].Value
            switch (Split-Path $file -Leaf) {
              "tasklist.exe" {
                # taskkill /F answers before a process has gone: it's gone by the next listing.
                foreach ($id in $script:Ending) { $script:Table = @($script:Table | Where-Object { $_.Id -ne $id }) }
                $script:Ending = @()
                if ($script:TasklistCode -ne 0) { return @{ Code = $script:TasklistCode; Out = "ERROR: Invalid query`r`n" } }
                $rows = @($script:Table | Where-Object { $_.Image -eq $image -and $_.User -eq $user } |
                  ForEach-Object { '"{0}","{1}","Console","1","5,284 K"' -f $_.Image, $_.Id })
                if (-not $rows) { return @{ Code = 0; Out = "INFO: No tasks are running which match the specified criteria.`r`n" } }
                return @{ Code = 0; Out = ($rows -join "`r`n") + "`r`n" }
              }
              "taskkill.exe" {
                if ($arguments -notmatch '^/F /FI "IMAGENAME eq [^"]+" /FI "USERNAME eq [^"]+" /PID \d+$') { Fail "taskkill $arguments" }
                $id = [int][regex]::Match($arguments, '/PID (\d+)').Groups[1].Value
                $hit = @($script:Table | Where-Object { $_.Id -eq $id -and $_.Image -eq $image -and $_.User -eq $user })
                if (-not $hit) { return @{ Code = 0; Out = "`r`nINFO: No tasks running with the specified criteria.`r`n" } }
                $script:Killed += $id
                if ($id -notin $script:Unkillable) { $script:Ending += $id }
                return @{ Code = 0; Out = "SUCCESS: The process with PID $id has been terminated.`r`n" }
              }
              "wsl.exe" {
                if ($arguments -ne "--terminate docker-desktop") { Fail "wsl $arguments" }
                return $script:Wsl
              }
              default { Fail "ran $file" }
            }
          }
          function Set-Table {
            $script:Table = @(
              @{ Image = "Docker Desktop.exe"; Id = 31692; User = $me },
              @{ Image = "Docker Desktop.exe"; Id = 23420; User = "OTHER\someone" },  # never ended
              @{ Image = "com.docker.backend.exe"; Id = 26876; User = $me },
              @{ Image = "com.docker.backend.exe"; Id = 29752; User = $me })
            $script:Unkillable = @(); $script:Ending = @(); $script:Killed = @(); $script:TasklistCode = 0
          }

          Set-Table
          $ids = Get-OwnPids "Docker Desktop.exe"
          if ($ids.Count -ne 1 -or $ids[0] -ne 31692) { Fail "Get-OwnPids listed $($ids -join ',')" }
          $none = Get-OwnPids "docker-sandbox.exe"
          if ($null -eq $none -or $none.Count -ne 0) { Fail "no processes should be an empty list, not `$null" }
          if (-not (Stop-DockerDesktopProcesses)) { Fail "Stop-DockerDesktopProcesses said it couldn't" }
          if ((@($script:Killed | Sort-Object) -join ",") -ne "26876,29752,31692") { Fail "ended $($script:Killed -join ',')" }
          if (-not ($script:Table | Where-Object { $_.Id -eq 23420 })) { Fail "another account's process was ended" }

          Set-Table; $script:Unkillable = @(26876)
          if (Stop-DockerDesktopProcesses) { Fail "a process that stays should say so" }
          Set-Table; $script:TasklistCode = 1
          if ($null -ne (Get-OwnPids "Docker Desktop.exe")) { Fail "a failed tasklist should be `$null" }
          if (Stop-DockerDesktopProcesses) { Fail "a failed tasklist should say it couldn't" }

          $script:Wsl = @{ Code = 0; Out = "The operation completed successfully. `r`n" }
          if (-not (Stop-DockerVm)) { Fail "a terminated VM" }
          $script:Wsl = @{ Code = -1; Out = "There is no distribution with the supplied name.`r`nError code: Wsl/Service/WSL_E_DISTRO_NOT_FOUND`r`n" }
          if (-not (Stop-DockerVm)) { Fail "a VM that isn't there counts as stopped" }
          $script:Wsl = @{ Code = 1; Out = "Catastrophic failure`r`n" }
          if (Stop-DockerVm) { Fail "a failed terminate" }
          $script:Wsl = $null
          if (Stop-DockerVm) { Fail "a terminate that didn't answer" }
          Write-Host "Only this account's Docker Desktop processes end; a stuck one, a failed listing or a failed terminate says so."
          exit 0
