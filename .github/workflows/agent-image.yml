name: Agent image

# Builds the agent image (images/agent) on both platforms, natively, when a
# pull request changes it: the image's own smoke test runs in its final
# stage (with the network off), so a package or check that fails on one
# architecture shows here, not first in a release. Nothing is pushed.
on:
  pull_request:
    paths:
      - "images/agent/**"
      - ".github/workflows/agent-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build and smoke-test (not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: images/agent
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: um-codex-agent:ci
      - name: Image size, and nothing baked into /codex-home
        run: |
          docker image ls um-codex-agent:ci --format '{{.Size}}'
          left="$(docker run --rm --entrypoint sh um-codex-agent:ci -c 'cd /codex-home && find . -mindepth 1 ! -path ./tmp ! -path "./tmp/*" | head')"
          if [ -n "$left" ]; then echo "/codex-home holds: $left"; exit 1; fi
