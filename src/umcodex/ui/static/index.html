<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UM-Codex</title>
  <link rel="icon" href="/static/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="top">
    <img class="mark" src="/static/mark.svg" alt="" width="36" height="36">
    <div class="title">
      <h1>UM-Codex</h1>
      <p class="sub">Codex on the U-M GPT Toolkit, in a sandbox on this computer</p>
    </div>
  </header>
  <section id="status" class="strip" aria-label="Status"></section>

  <!-- The key, inline (not a pop-up): shown when none is saved, or by Replace key. -->
  <section id="key-panel" class="key-panel" aria-labelledby="key-title" hidden>
    <form id="key-form" autocomplete="off">
      <h2 id="key-title" class="label">Toolkit API key</h2>
      <p class="help">Paste your U-M GPT Toolkit API key. It's checked with the Toolkit, saved in
        this computer's keychain, and never goes into the sandbox.</p>
      <div class="key-row">
        <input id="key-input" type="text" class="masked" autocomplete="new-password" autocapitalize="off"
          autocorrect="off" spellcheck="false" data-1p-ignore data-lpignore="true" data-bwignore
          data-form-type="other" aria-label="Toolkit API key (shown as dots)" aria-describedby="key-message" required>
        <button type="submit" class="primary" id="key-save">Save key</button>
        <button type="button" id="key-cancel">Cancel</button>
      </div>
      <p id="key-message" class="message" role="alert" hidden></p>
    </form>
  </section>

  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <main id="main"><p class="faint">Loading…</p></main>
  <!-- What changed on a card (its status line), said once; main itself isn't announced on every redraw. -->
  <div id="announce" class="visually-hidden" role="status" aria-live="polite"></div>

  <!-- Only before something that can't be undone (Stop, Delete) or Windows' administrator prompt. -->
  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="actions">
        <button value="no" id="confirm-no">Cancel</button>
        <button value="yes" class="danger-solid" id="confirm-yes">OK</button>
      </div>
    </form>
  </dialog>
</body>
</html>
