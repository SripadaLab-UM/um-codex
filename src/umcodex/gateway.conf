# Adapted from DataLab's backend/src/datalab/sessions/gateway.conf at 6b6fdca (/mcp removed).
# UM-Codex launch gateway (stock nginx). Rendered per launch by UM-Codex.
# It only routes, and holds no secrets: the model relay runs in UM-Codex on
# the host, checks the launch token and adds the Toolkit key.
server {
    listen 80;
    server_name gateway;

    client_max_body_size 32m;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host 127.0.0.1:{port};
    proxy_set_header Connection "";

    # Model requests go to UM-Codex's relay, which checks the token and adds the key.
    location /v1/ {
        proxy_pass http://host.docker.internal:{port}/relay/v1/;
    }

    location / {
        return 404;
    }
}
